# cargo-deny configuration for the gpui-app crate.
#
# Same policy as src-tauri/deny.toml (see docs/ROADMAP.md Phase 1 + Phase 8):
# permissive licenses only; no GPL/copyleft without an explicit, documented
# exception. MPL-2.0 is allowed deliberately (cargo-deny default template).

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    # NCSA (libfuzzer-sys via rav1e <- ravif <- image <- gpui): permissive,
    # OSI-approved; required for the AV1 encoder in the image stack.
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # chardet (LGPL-3.0) - EXPLICIT EXCEPTION (Roadmap Phase 1/8): charset-
    # detection helper, direct dependency of the GPUI port as well. Weak
    # copyleft accepted deliberately for the offline encoding-detection
    # feature; obligations documented in docs/ROADMAP.md.
    { name = "chardet", version = "*", allow = ["LGPL-3.0"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
unmaintained = "workspace"
