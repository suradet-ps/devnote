[package]
name = "devnote-gpui"
version = "0.1.0"
edition = "2024"
description = "devnote - pure Rust (GPUI) port of the Tauri + Svelte editor"
license = "MIT"
readme = "../README.md"

[[bin]]
name = "devnote-gpui"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
encoding_rs = "0.8"
chardet = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"
tempfile = "3"
rfd = "0.15"
dirs = "6"
sys-locale = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
